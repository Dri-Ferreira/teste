<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área de Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>DevSchool</h1>
        <p>Área do Aluno</p>
    </header>

    <main>

        <section class="login">

            <h2>Entrar</h2>

            <p class="descricao">
                Digite seus dados para acessar sua conta.
            </p>

            <form>

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                >

                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

            <p class="cadastro">
                Ainda não possui uma conta?
                <a href="#">Cadastre-se</a>
            </p>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 DevSchool - Todos os direitos reservados.</p>
    </footer>

</body>

</html>
